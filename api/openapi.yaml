openapi: 3.0.3
info:
  title: Train Railway Booking System API
  version: 1.0.0
  description: API для електронної системи продажу залізничних квитків (веб-додаток "Train")

servers:
  - url: http://localhost:8000/api/v1
    description: Development server

paths:
  /routes:
    get:
      summary: Отримати список маршрутів (пошук рейсів)
      operationId: getRoutes
      tags: [Routes]
      responses:
        '200':
          description: Успішний пошук маршрутів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
    post:
      summary: Додати новий маршрут (для адміністратора)
      operationId: createRoute
      tags: [Routes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      responses:
        '201':
          description: Маршрут створено
        '400':
          $ref: '#/components/responses/BadRequest'

  /routes/{id}:
    get:
      summary: Отримати деталі конкретного маршруту
      operationId: getRouteById
      tags: [Routes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі маршруту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Оновити дані маршруту
      operationId: updateRoute
      tags: [Routes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Маршрут оновлено
    delete:
      summary: Видалити маршрут
      operationId: deleteRoute
      tags: [Routes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Маршрут видалено

  /tickets:
    get:
      summary: Отримати список квитків користувача
      operationId: getTickets
      tags: [Tickets]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список квитків
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    post:
      summary: Забронювати новий квиток
      operationId: createTicket
      tags: [Tickets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route_id:
                  type: integer
                seat_id:
                  type: integer
      responses:
        '201':
          description: Квиток успішно заброньовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tickets/{id}:
    get:
      summary: Перевірити інформацію про квиток
      operationId: getTicketById
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі квитка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Змінити статус квитка (скасувати)
      operationId: updateTicketStatus
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Статус квитка оновлено

  /payments:
    post:
      summary: Ініціювати оплату за квиток
      operationId: createPayment
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        '201':
          description: Транзакцію створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /payments/{id}:
    get:
      summary: Отримати статус оплати
      operationId: getPaymentById
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі транзакції
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Route:
      type: object
      properties:
        id_route:
          type: integer
        train_id:
          type: integer
        departure_station:
          type: string
        arrival_station:
          type: string
        departure_time:
          type: string
          format: date-time
          
    Ticket:
      type: object
      properties:
        id_ticket:
          type: integer
        user_id:
          type: integer
        route_id:
          type: integer
        seat_id:
          type: integer
        price:
          type: number
          format: float
        status:
          type: string
          enum: [booked, paid, cancelled]
          
    Payment:
      type: object
      properties:
        id_payment:
          type: integer
        ticket_id:
          type: integer
        amount:
          type: number
          format: float
        payment_date:
          type: string
          format: date-time
        transaction_status:
          type: string
          enum: [pending, success, failed]

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

  responses:
    BadRequest:
      description: Некоректний запит
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не знайдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
